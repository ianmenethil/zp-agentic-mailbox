# Blocks push if Cloudflare-style checks would fail.
# Install hooks: pnpm install  (runs `prepare` → lefthook install)

pre-push:
  parallel: false
  commands:
    frozen-lockfile:
      run: pnpm install --frozen-lockfile
    test-rpc:
      run: pnpm run test:rpc
    typecheck:
      run: pnpm run typecheck
    lint:
      run: pnpm run lint
    knip:
      run: pnpm run knip
    jscpd:
      run: pnpm run jscpd
    build:
      run: pnpm run build

pre-commit:
  parallel: true
  commands:
    package-json-valid:
      glob: "package.json"
      run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
    workspace-yaml-present:
      glob: "{pnpm-workspace.yaml,pnpm-lock.yaml,package.json}"
      run: test -f pnpm-lock.yaml && test -f pnpm-workspace.yaml
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm run lint
